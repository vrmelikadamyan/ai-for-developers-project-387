name: PR review
run-name: 'Review PR #${{ github.event.workflow_run.pull_requests[0].number }} at ${{ github.event.workflow_run.head_sha }}'

on:
  # The model and publisher use workflow/scripts from the default branch and no artifacts from the PR.
  # actionlint ignore=trigger "workflow_run" is dangerous
  workflow_run:
    workflows: [PR review request]
    types: [completed]

permissions: {}

# Deduplicate requests for one SHA. Only an eligible current SHA may cancel a different SHA below.
concurrency:
  group: pr-review-snapshot-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}

jobs:
  source:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/pr-review-request.yml' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id &&
      github.event.workflow_run.pull_requests[0].head.sha == github.event.workflow_run.head_sha
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # default branch on workflow_run
          persist-credentials: false
      - id: source
        name: Check author, repository and current PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_review.py eligible >> "$GITHUB_OUTPUT"

  review:
    needs: source
    if: needs.source.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: pr-review-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    env:
      OPENCODE_TOOL: aqua:anomalyco/opencode@1.19.6
    outputs:
      body: ${{ steps.model.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Collect evidence at the requested head SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/pr_review.py context > "$RUNNER_TEMP/evidence.json"
          {
            cat REVIEW.md
            printf '\n\nДанные для ревью в формате JSON:\n'
            cat "$RUNNER_TEMP/evidence.json"
          } > "$RUNNER_TEMP/review-prompt"

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Install the pinned review CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: mise install "$OPENCODE_TOOL"

      - name: Review with OpenCode and DeepSeek
        id: model
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        working-directory: ${{ runner.temp }}
        run: |
          binary=$(mise which opencode --tool "$OPENCODE_TOOL")
          scratch=$(mktemp -d)
          cd "$scratch"
          env -i HOME="$HOME" PATH="/usr/local/bin:/usr/bin:/bin" \
            XDG_CONFIG_HOME="$scratch/config" XDG_DATA_HOME="$scratch/data" \
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            OPENCODE_CONFIG_CONTENT='{"permission":{"*":"deny"},"share":"disabled"}' \
            "$binary" run --pure --model deepseek/deepseek-flash --format json \
            < "$RUNNER_TEMP/review-prompt" > events.jsonl
          body=$(jq -ers '
            if any(.[]; .type == "error") then error("OpenCode review failed") else
              [.[] | select(.type == "text") | .part.text] | join("\n") |
              select(test("\\S")) | .[:18000] | @base64
            end' events.jsonl)
          echo "body=$body" >> "$GITHUB_OUTPUT"

  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Comment only if this head is still current
        env:
          GH_TOKEN: ${{ github.token }}
          ENCODED_REVIEW: ${{ needs.review.outputs.body }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open") | .head.sha')
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo 'The PR is closed or has a newer head.'
            exit 0
          fi
          test -n "$ENCODED_REVIEW"
          {
            printf 'Независимое авторевью · %s · [прогон](%s/%s/actions/runs/%s)\n\n' \
              "$HEAD_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '%s' "$ENCODED_REVIEW" | base64 --decode
          } > "$RUNNER_TEMP/review.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review.md"
