name: OpenCode
# Actions assigns the budget key from the original event. Neither editing a comment
# nor the agent's response can change the request recorded in workflow history.
run-name: >-
  ${{ github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode ')) &&
      format('OpenCode {0} #{1}', (github.event.issue.pull_request || github.event.pull_request) && 'PR' || 'issue',
             github.event.issue.number || github.event.pull_request.number) || 'Ignored OpenCode comment' }}

on:
  # actionlint ignore=trigger "issue_comment" is dangerous
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

# Serialize the whole attempt, including its reporter. Pending requests keep
# their place; a retry of a failed model job must pass the budget step again.
concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  queue: max

env:
  NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  opencode:
    name: Interactive OpenCode
    if: >-
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode ')) &&
      (github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event.issue.pull_request || github.event.pull_request) && 15 || 45 }}
    permissions:
      actions: read
      contents: read
      issues: write # gh publishes specs and tickets on trusted issue requests
      pull-requests: read
      id-token: write # OpenCode App performs the git push and PR creation
    outputs:
      budget: ${{ steps.budget.outputs.decision }}
    env:
      OPENCODE_TOOL: aqua:anomalyco/opencode@1.19.6

    steps:
      - name: Check the request and live PR origin
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .display_title)
          case "$title" in
            "OpenCode issue #$NUMBER") ;;
            "OpenCode PR #$NUMBER")
              head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.repo.full_name)
              [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || exit 0 ;;
            *) exit 0 ;;
          esac
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.request.outputs.title != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check this attempt against the PR budget
        id: budget
        shell: bash
        if: steps.request.outputs.title != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_TITLE: ${{ steps.request.outputs.title }}
        run: |
          decision=allowed
          if [[ "$REQUEST_TITLE" == "OpenCode PR #$NUMBER" ]]; then
            decision=$(python3 .github/scripts/opencode_budget.py)
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Check DeepSeek configuration
        if: steps.budget.outputs.decision == 'allowed'
        env:
          HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          if [[ "$HAS_DEEPSEEK_KEY" != true ]]; then
            echo "::error::DEEPSEEK_API_KEY is missing from Actions secrets"
            exit 1
          fi

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: steps.budget.outputs.decision == 'allowed'

      - name: Install pinned OpenCode
        if: steps.budget.outputs.decision == 'allowed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install "$OPENCODE_TOOL"

      - name: Run OpenCode
        if: steps.budget.outputs.decision == 'allowed'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODEL: deepseek/deepseek-flash
          MENTIONS: /oc,/opencode
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"external_directory":{"*":"deny","/tmp":"allow","/tmp/*":"allow"}}}
        run: mise exec "$OPENCODE_TOOL" -- opencode github run

  report:
    name: Report stopped request
    needs: opencode
    if: >-
      always() && (needs.opencode.outputs.budget == 'limit_exhausted' ||
                   needs.opencode.result == 'failure' || needs.opencode.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write # report failures on issue requests
      pull-requests: write # report failures on PR requests
    steps:
      - name: Publish the reason and attempt log
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET: ${{ needs.opencode.outputs.budget }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          run=$(gh api "$api/actions/runs/$GITHUB_RUN_ID")
          title=$(jq -r .display_title <<< "$run")
          case "$title" in
            "OpenCode PR #$NUMBER")
              head=$(gh api "$api/pulls/$NUMBER" --jq '.head | select(.repo.full_name == env.GITHUB_REPOSITORY) | .sha')
              [[ -n "$head" ]] || exit 0 ;;
            "OpenCode issue #$NUMBER") head=$(jq -r .head_sha <<< "$run") ;;
            *) exit 0 ;;
          esac
          reason=$BUDGET
          if [[ "$reason" != limit_exhausted ]]; then
            reason=$(gh api "$api/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '
              .jobs[] | select(.name == "Interactive OpenCode") |
              if .conclusion == "timed_out" then "timeout"
              elif any(.steps[]?; .name == "Run OpenCode" and .conclusion == "failure") then "agent_failed"
              else "infra" end') || reason=infra
            reason=${reason:-infra}
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh api -X POST "$api/issues/$NUMBER/comments" -f body="OpenCode остановлен — \`$reason\`. Статус **нужен человек**. Head SHA \`$head\`. [Журнал запуска]($url)"
