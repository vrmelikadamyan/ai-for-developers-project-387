name: OpenCode

on:
  # The job checks the commenter and PR origin before checkout or access to DeepSeek.
  # actionlint ignore=trigger "issue_comment" is dangerous
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  opencode:
    if: >-
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode ')) &&
      (github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # gh publishes specs and tickets on a trusted /oc request
      pull-requests: read
      id-token: write
    concurrency:
      group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Check the source repository for PR conversations
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if jq -e '.issue.pull_request' "$GITHUB_EVENT_PATH" >/dev/null; then
            number=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
            head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.repo.full_name')
            if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "Skipping a comment on a pull request from another repository."
              exit 0
            fi
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.allowed == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: steps.source.outputs.allowed == 'true'

      - name: Run OpenCode with DeepSeek
        if: steps.source.outputs.allowed == 'true'
        uses: anomalyco/opencode/github@f4e363c8295fa90a03dddc451882fffe8fbce357 # v1.19.6
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: deepseek/deepseek-flash
          mentions: '/oc,/opencode'
          share: 'false'
